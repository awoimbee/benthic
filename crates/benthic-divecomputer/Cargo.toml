[package]
name = "benthic-divecomputer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "libdivecomputer integration for benthic: device discovery and dive parsing"
license = "GPL-2.0-or-later"
publish = false
build = "build.rs"

[lib]
name = "benthic_divecomputer"
path = "src/lib.rs"
test = false

[features]
# Build and link the vendored libdivecomputer, plus the BlueZ BLE transport.
# Off by default so the plain workspace build stays pure Rust on machines
# without the C toolchain or D-Bus.
native = ["dep:bluer", "dep:futures", "dep:tokio"]

[[test]]
name = "fixtures"
path = "tests/fixtures.rs"
required-features = ["native"]

[[test]]
name = "device"
path = "tests/device.rs"
required-features = ["native"]

[[example]]
name = "inspect"
path = "examples/inspect.rs"
required-features = ["native"]

[[example]]
name = "dctool"
path = "examples/dctool.rs"
required-features = ["native"]

[dependencies]
benthic-core = { path = "../benthic-core" }
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"], optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt", "time", "macros"], optional = true }
