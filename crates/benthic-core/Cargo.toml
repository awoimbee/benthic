[package]
name = "benthic-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Platform-agnostic dive-log domain model and file formats for benthic"
license = "GPL-2.0-or-later"
repository = "https://github.com/awoimbee/benthic"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.37"
time = { version = "0.3", features = ["formatting", "parsing"] }
thiserror = "2"
