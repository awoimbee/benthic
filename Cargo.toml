[package]
name = "benthic"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A modern, cross-platform dive log — a Dioxus rewrite of Subsurface"
license = "GPL-2.0-or-later"
repository = "https://github.com/awoimbee/benthic"
homepage = "https://awoimbee.github.io/benthic/"
readme = "README.md"
default-run = "benthic"

[workspace]
members = ["crates/benthic-core", "crates/benthic-divecomputer"]
resolver = "2"

[dependencies]
benthic-core = { path = "crates/benthic-core" }
dioxus = { version = "0.7", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
base64 = "0.23.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "DomTokenList",
    "HtmlAnchorElement",
    "Blob",
    "Url",
] }
gloo-storage = "0.4"
indexed_db_futures = "0.6.4"
wasm-bindgen-futures = "0.4.79"
gloo-net = "0.7.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "6"
# Desktop transport and the native (loopback + PKCE) OAuth flow.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros"] }
sha2 = "0.11"
getrandom = "0.4"
webbrowser = "1"
url = "2"
futures-util = "0.3"
# Device download (optional; enables the vendored libdivecomputer).
benthic-divecomputer = { path = "crates/benthic-divecomputer", optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
# Dive-computer download; native only.
divecomputer = ["dep:benthic-divecomputer", "benthic-divecomputer/native"]
desktop = ["dioxus/desktop", "divecomputer"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
