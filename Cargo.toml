[package]
name = "benthic"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A modern, cross-platform dive log — a Dioxus rewrite of Subsurface"
license = "GPL-2.0-or-later"
repository = "https://github.com/awoimbee/benthic"
homepage = "https://awoimbee.github.io/benthic/"
readme = "README.md"
default-run = "benthic"

[workspace]
members = ["crates/benthic-core"]
resolver = "2"

[dependencies]
benthic-core = { path = "crates/benthic-core" }
dioxus = { version = "0.7", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "Blob",
    "Url",
] }
gloo-storage = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "5"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
